appId: com.ringcode.app
productName: 金刚琢
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron-dist/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # GitHub Release 会丢掉中文附件名（常变成 default.zip），产物文件名必须 ASCII。
  artifactName: RingCode-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: 金刚琢
asar: true
asarUnpack:
  - node_modules/@napi-rs/**
npmRebuild: false
